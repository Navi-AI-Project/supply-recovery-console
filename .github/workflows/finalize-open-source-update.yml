name: Finalize open-source update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-open-source-update.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply validated source patch
        shell: bash
        run: |
          set -euo pipefail
          payload="$(awk '/^[[:space:]]*H4sI/{gsub(/[[:space:]]/, ""); print; exit}' .github/workflows/apply-open-source-update.yml)"
          fixed="${payload:0:7311}R${payload:7311}"
          printf '%s' "$fixed" | base64 -d | gzip -d > /tmp/source-update.patch
          git apply --whitespace=nowarn /tmp/source-update.patch
          rm .github/workflows/ci.yml
          rm .github/workflows/apply-open-source-update.yml
          rm .github/workflows/retry-open-source-update.yml
          rm .github/workflows/finalize-open-source-update.yml

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare project for open-source adoption"
          git push
