name: Expand project source

on:
  push:
    branches:
      - main
    paths:
      - github-core-source.zip
      - .github/workflows/unpack-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand verified project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f github-core-source.zip
          unzip -o github-core-source.zip
          rm github-core-source.zip
          rm .github/workflows/unpack-source.yml
          rmdir .github/workflows
          rmdir .github

      - name: Commit project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import Supply Recovery Console source"
          git push
