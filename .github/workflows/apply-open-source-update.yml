name: Apply open-source update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-open-source-update.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply validated source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/source-update.patch.gz.b64 <<'PATCH_DATA'
          
          PATCH_DATA
          base64 -d /tmp/source-update.patch.gz.b64 | gzip -d > /tmp/source-update.patch
          git apply --whitespace=nowarn /tmp/source-update.patch
          rm .github/workflows/apply-open-source-update.yml

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare project for open-source adoption"
          git push
