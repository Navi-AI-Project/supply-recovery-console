name: Apply open-source update

on:
  push:
    branches:
      - main
    paths:
      - github-open-source-update.zip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply validated source
        shell: bash
        run: |
          set -euo pipefail
          test -f github-open-source-update.zip
          unzip -o github-open-source-update.zip
          rm github-open-source-update.zip
          rm .github/workflows/apply-open-source-update.yml

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare project for open-source adoption"
          git push
