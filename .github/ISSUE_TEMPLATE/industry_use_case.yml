name: Industry use case
description: Describe an operations workflow that could benefit from this human-agent pattern.
title: "[Use case]: "
body:
  - type: markdown
    attributes:
      value: Share only anonymized or synthetic details. Do not include customer names, shipment identifiers, credentials, prices, contracts, or internal system URLs.
  - type: input
    id: sector
    attributes:
      label: Sector or operating context
      placeholder: Manufacturing, retail, healthcare logistics, maritime, aviation, energy...
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision workflow
      description: What event occurs, what evidence is reviewed, and what decision must be made?
    validations:
      required: true
  - type: textarea
    id: systems
    attributes:
      label: Systems involved
      description: Name generic system categories such as ERP, TMS, WMS, carrier portal, or digital twin.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Human authority boundary
      description: Which steps may an agent perform, and which decision must remain human-only?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Useful pilot outcome
      description: What measurable result would make a small, controlled pilot valuable?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: This description contains no sensitive or identifying operational data.
          required: true
