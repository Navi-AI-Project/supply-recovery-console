name: Feature request
description: Propose a focused improvement to the reference implementation.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user, workflow, and limitation without prescribing implementation first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest useful change and where it fits in the current workflow.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - WebMCP tool contract
        - Human approval and safety
        - Supply-chain scenario
        - Optimization engine
        - Integration adapter
        - User interface and accessibility
        - Testing and interoperability
        - Documentation
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority and safety impact
      description: State whether the proposal reads, stages, approves, commits, or reverses operational state.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable behavior and tests that would demonstrate completion.
    validations:
      required: true
